name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax check
        run: |
          node --check node/core.mjs
          node --check node/render.mjs
          node --check node/device.mjs
          node --check node/daemon.mjs
